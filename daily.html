<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>אימון יומי - נווה</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Rubik', sans-serif; background: #fffbeb; padding: 15px; color: #0f172a; display: flex; flex-direction: column; align-items: center; }
        .back-nav { width: 100%; max-width: 500px; margin-bottom: 10px; }
        .back-btn { text-decoration: none; color: #b45309; font-weight: 700; }
        .box { background: white; border-radius: 20px; padding: 20px; width: 100%; max-width: 500px; border: 2px solid #f59e0b; text-align: center; }
        .timer { font-size: 1.2rem; font-weight: 700; color: #b45309; margin-bottom: 15px; }
        .flash-card { font-family: 'Fredoka', sans-serif; font-size: 3.5rem; color: #0284c7; background: #e0f2fe; border-radius: 16px; padding: 20px; margin-bottom: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="back-nav"><a href="index.html" class="back-btn">➡️ חזרה למרכז</a></div>
    <div class="box">
        <div class="timer">⚡ אימון יומי של 2 דקות!</div>
        <p style="font-weight:700; margin-bottom:10px;">לחץ על הקלף כדי לגלות את הפירוש בעברית:</p>
        <div class="flash-card" id="flashCard" onclick="flipCard()">I</div>
        <button style="background:#f59e0b; color:white; border:none; padding:10px 20px; border-radius:10px; font-weight:700; cursor:pointer;" onclick="nextCard()">הקלף הבא ⬅️</button>
    </div>

    <script>
        const cards = [
            { en: 'I', he: 'אני' },
            { en: 'You', he: 'אתה / את' },
            { en: 'He', he: 'הוא (בן)' },
            { en: 'She', he: 'היא (בת)' },
            { en: 'It', he: 'זה (חפץ/חיה)' },
            { en: 'We', he: 'אנחנו' },
            { en: 'They', he: 'הם / הן' }
        ];
        let idx = 0;
        let isFlipped = false;

        function flipCard() {
            const el = document.getElementById('flashCard');
            if (!isFlipped) {
                el.textContent = cards[idx].he;
                el.style.background = '#fef3c7';
                el.style.color = '#b45309';
            } else {
                el.textContent = cards[idx].en;
                el.style.background = '#e0f2fe';
                el.style.color = '#0284c7';
            }
            isFlipped = !isFlipped;
        }

        function nextCard() {
            idx = (idx + 1) % cards.length;
            isFlipped = false;
            const el = document.getElementById('flashCard');
            el.textContent = cards[idx].en;
            el.style.background = '#e0f2fe';
            el.style.color = '#0284c7';
        }
    </script>
</body>
</html>
